[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-verification"
version = "1.1.0"
description = "Standalone bibliographic identity verification with injected capabilities"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["httpx>=0.27,<1", "openpyxl>=3.1,<4", "PyMuPDF>=1.26,<2", "python-docx>=1.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
reference-verification = "citrus_refcheck.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["citrus_refcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
build = ["setuptools==80.9.0", "wheel==0.45.1"]
